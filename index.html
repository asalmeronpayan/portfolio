<style>
:root{
  --bg:#FAFAF7;
  --ink:#0A0A0A;
  --paper:#FFFFFF;
  --yellow:#FFD400;
  --yellow-hi:#FFF27A;
  --yellow-deep:#E5A800;
  --live:#00C24A;
  --line:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Archivo",system-ui,sans-serif;
  font-size:17px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  background-image:
    repeating-linear-gradient(0deg,rgba(10,10,10,.045) 0 1px,transparent 1px 34px),
    repeating-linear-gradient(90deg,rgba(10,10,10,.045) 0 1px,transparent 1px 34px);
}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ── HEADER ── */
header{border-top:var(--line) solid var(--ink);border-bottom:var(--line) solid var(--ink);background:var(--paper)}
.head-grid{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding:54px 0 34px}
@media(max-width:720px){.head-grid{grid-template-columns:1fr;align-items:start}.head-meta{text-align:left}}
h1{
  font-family:"Archivo Black",sans-serif;
  font-size:clamp(2.3rem,10vw,6.6rem);
  line-height:.88;text-transform:uppercase;letter-spacing:-.03em;
}
h1 em{font-style:normal;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.role{
  margin-top:20px;display:inline-block;
  background:var(--yellow);border:var(--line) solid var(--ink);
  box-shadow:7px 7px 0 var(--ink);
  padding:9px 16px;
  font-family:"JetBrains Mono",monospace;font-weight:700;
  font-size:13px;letter-spacing:.1em;text-transform:uppercase;
}
.head-meta{font-family:"JetBrains Mono",monospace;font-size:12px;text-transform:uppercase;letter-spacing:.1em;text-align:right;line-height:2}
.head-meta a{color:var(--ink);text-decoration:none;border-bottom:2px solid var(--yellow-deep)}
@media(hover:hover){.head-meta a:hover{background:var(--yellow)}}

/* ── ESTADO DISPONIBLE ── */
.live{display:inline-flex;align-items:center;gap:8px}
.dot{
  width:11px;height:11px;flex:none;
  background:var(--live);
  border:2px solid var(--ink);
  border-radius:50%;
  box-shadow:0 0 0 0 rgba(0,194,74,.75);
  animation:pulse 2s ease-out infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(0,194,74,.7)}
  70%{box-shadow:0 0 0 9px rgba(0,194,74,0)}
  100%{box-shadow:0 0 0 0 rgba(0,194,74,0)}
}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}

/* ── SELECTOR DE IDIOMA ── */
.lang{position:fixed;top:18px;right:18px;z-index:60}
.lang-btn{
  display:flex;align-items:center;gap:9px;
  background:var(--paper);color:var(--ink);
  border:var(--line) solid var(--ink);
  box-shadow:5px 5px 0 var(--ink);
  padding:9px 13px;cursor:pointer;
  font-family:"JetBrains Mono",monospace;font-weight:700;
  font-size:13px;letter-spacing:.1em;text-transform:uppercase;
}
.lang-btn:hover{background:var(--yellow)}
.lang-btn .car{font-size:9px;transition:transform .15s}
.lang[data-open="true"] .lang-btn{background:var(--yellow)}
.lang[data-open="true"] .car{transform:rotate(180deg)}
.lang-menu{
  position:absolute;top:calc(100% + 7px);right:0;
  min-width:100%;
  background:var(--paper);
  border:var(--line) solid var(--ink);
  box-shadow:5px 5px 0 var(--ink);
  display:none;
}
.lang[data-open="true"] .lang-menu{display:block}
.lang-menu button{
  display:flex;align-items:center;gap:9px;width:100%;
  background:none;border:0;cursor:pointer;
  padding:10px 13px;text-align:left;
  font-family:"JetBrains Mono",monospace;font-weight:700;
  font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink);
  border-bottom:2px solid var(--ink);
}
.lang-menu button:last-child{border-bottom:0}
.lang-menu button:hover,.lang-menu button:focus{background:var(--yellow);outline:0}
.lang-menu button[aria-current="true"]{background:var(--ink);color:var(--yellow)}
.flag{
  width:22px;height:15px;flex:none;display:block;
  border:1.5px solid var(--ink);
}
#langFlag{display:flex;align-items:center}
@media(max-width:720px){
  .lang{top:12px;right:12px}
  .lang-btn{padding:7px 10px;font-size:12px}
}

/* ── SECTION BAR ── */
.bar{
  background:var(--ink);color:var(--bg);
  border-bottom:var(--line) solid var(--ink);
  font-family:"JetBrains Mono",monospace;font-weight:700;
  font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  padding:13px 0;
}
.bar .wrap{display:flex;justify-content:space-between;gap:16px}
.bar h2{font:inherit;letter-spacing:inherit}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:34px;padding-top:52px;padding-bottom:70px}
@media(max-width:1024px){.grid{gap:26px;padding-top:40px;padding-bottom:56px}}
@media(max-width:700px){.grid{grid-template-columns:1fr;gap:30px}}

.card{
  background:var(--paper);
  border:var(--line) solid var(--ink);
  box-shadow:12px 12px 0 var(--ink);
  display:flex;flex-direction:column;
  cursor:pointer;
  container-type:inline-size;
  min-width:0;
  transition:transform .12s steps(2),box-shadow .12s steps(2);
}
.card:focus-within{transform:translate(-5px,-5px);box-shadow:10px 10px 0 var(--yellow),18px 18px 0 var(--ink)}
@media(hover:hover){.card:hover{transform:translate(-5px,-5px);box-shadow:10px 10px 0 var(--yellow),18px 18px 0 var(--ink)}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}

.card-num{
  font-family:"JetBrains Mono",monospace;font-weight:700;font-size:12px;
  letter-spacing:.2em;text-transform:uppercase;
  border-bottom:var(--line) solid var(--ink);
  padding:9px 15px;display:flex;justify-content:space-between;gap:12px;
  background:var(--yellow);
}

/* ── PREVIEW ── */
.shot{
  position:relative;
  border-bottom:var(--line) solid var(--ink);
  aspect-ratio:16/10;overflow:hidden;background:var(--bg);
}
.shot iframe{
  position:absolute;top:0;left:0;
  width:1440px;height:900px;
  transform-origin:0 0;
  border:0;pointer-events:none;
  background:#fff;
}
.shot img{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  object-fit:cover;object-position:top center;
  display:block;
}
.veil{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:transparent;
  transition:background .12s;
}
.card:focus-within .veil{background:rgba(255,242,122,.35)}
@media(hover:hover){.card:hover .veil{background:rgba(255,242,122,.35)}}
.veil b{
  opacity:0;
  background:var(--ink);color:var(--yellow);
  border:3px solid var(--yellow-hi);
  padding:12px 20px;
  font-family:"JetBrains Mono",monospace;font-size:13px;
  letter-spacing:.16em;text-transform:uppercase;
  transition:opacity .12s;
}
.card:focus-within .veil b{opacity:1}
@media(hover:hover){.card:hover .veil b{opacity:1}}
.loading{
  position:absolute;inset:0;z-index:2;
  display:flex;align-items:center;justify-content:center;
  font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink);background:var(--bg);
}
.shot.ready .loading{display:none}

/* ── CARD BODY ── */
.body{padding:22px 20px 24px;display:flex;flex-direction:column;gap:13px;flex:1}
.body h3{
  font-family:"Archivo Black",sans-serif;
  font-size:clamp(1.05rem,6.8cqi,1.9rem);line-height:1;text-transform:uppercase;letter-spacing:-.02em;
  overflow-wrap:anywhere;
}
.body p{font-size:15.5px;max-width:46ch}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.tags span{
  border:3px solid var(--ink);padding:4px 10px;
  font-family:"JetBrains Mono",monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;font-weight:700;
}
.go{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:var(--ink);color:var(--paper);
  padding:15px 20px;text-decoration:none;
  font-family:"JetBrains Mono",monospace;font-weight:700;
  font-size:13px;letter-spacing:.14em;text-transform:uppercase;
}
.go:focus{background:var(--yellow);color:var(--ink);outline:0}
@media(hover:hover){.card:hover .go,.go:hover{background:var(--yellow);color:var(--ink)}}
.go:focus-visible{outline:4px solid var(--yellow);outline-offset:-8px}
.go i{font-style:normal;font-size:19px}

/* ── FOOTER ── */
footer{border-top:var(--line) solid var(--ink);background:var(--ink);color:var(--bg);padding:58px 0 40px}
footer h2{font-family:"Archivo Black",sans-serif;font-size:clamp(1.9rem,6vw,3.6rem);text-transform:uppercase;line-height:.95;letter-spacing:-.02em}
footer h2 span{color:var(--yellow)}
.mail{
  display:inline-block;margin-top:24px;
  background:var(--yellow);color:var(--ink);
  border:var(--line) solid var(--paper);box-shadow:9px 9px 0 var(--yellow-deep);
  padding:15px 24px;text-decoration:none;
  font-family:"JetBrains Mono",monospace;font-weight:700;
  font-size:16px;letter-spacing:.08em;word-break:break-word;
  display:inline-flex;align-items:center;gap:14px;
}
@media(hover:hover){.mail:hover{background:var(--paper)}}
.mail-alt{
  margin-top:20px;
  font-family:"JetBrains Mono",monospace;font-size:12.5px;
  letter-spacing:.06em;color:rgba(250,250,247,.62);
}
.mail-alt a{color:var(--paper);text-decoration:none;border-bottom:2px solid var(--yellow)}
.mail-alt a:hover{color:var(--yellow)}
.fine-li{color:var(--bg);text-decoration:none;border-bottom:2px solid var(--yellow)}
.fine-li:hover{color:var(--yellow)}
.fine{
  margin-top:46px;padding-top:18px;border-top:2px solid rgba(250,250,247,.3);
  font-family:"JetBrains Mono",monospace;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
}

/* ── TABLET ── */
@media(max-width:1024px){
  .wrap{padding-left:24px;padding-right:24px}
  .head-grid{padding-top:64px;padding-bottom:30px}
  .card{box-shadow:10px 10px 0 var(--ink)}
  .body{padding:20px 18px 22px}
  .go{padding:14px 18px}
}

/* ── MÓVIL ── */
@media(max-width:720px){
  body{font-size:16px;background-size:26px 26px}
  .wrap{padding-left:22px;padding-right:22px}
  .head-grid{padding-top:74px;padding-bottom:32px;gap:24px;justify-items:center;text-align:center}
  h1 em{-webkit-text-stroke:2px var(--ink)}
  .role{margin-top:18px;padding:8px 12px;font-size:11.5px;box-shadow:5px 5px 0 var(--ink)}
  .head-meta{font-size:12.5px;line-height:2.2;text-align:center}
  .bar{font-size:11px;letter-spacing:.14em;padding:11px 0}
  /* 8px más a la derecha para compensar la sombra y que la tarjeta se vea centrada */
  .grid{padding-top:30px;padding-bottom:44px;padding-right:30px;gap:30px}
  .card{box-shadow:8px 8px 0 var(--ink)}
  .card:focus-within{transform:none;box-shadow:6px 6px 0 var(--yellow),10px 10px 0 var(--ink)}
  .card-num{font-size:11px;letter-spacing:.12em;padding:8px 12px}
  .card-num span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .body{padding:20px 16px 22px;gap:11px;text-align:center;align-items:center}
  .body p{font-size:15px}
  .tags{justify-content:center}
  .tags span{font-size:10.5px;padding:3px 8px}
  .go{justify-content:center;padding:14px 16px;font-size:12px;letter-spacing:.1em}
  .go span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  footer{padding:48px 0 30px;text-align:center}
  footer .wrap{padding-right:28px}
  .mail{display:flex;width:100%;justify-content:center;padding:14px 16px;font-size:14px;letter-spacing:.04em;box-shadow:6px 6px 0 var(--yellow-deep)}
  .mail-alt{font-size:12px;line-height:1.8}
  .fine{margin-top:34px;flex-direction:column;align-items:center;gap:8px}
}
@media(max-width:380px){
  .wrap{padding-left:16px;padding-right:16px}
  .grid{padding-left:16px;padding-right:24px}
  footer .wrap{padding-right:22px}
}
/* ── CARRUSEL DE PROYECTOS (solo móvil) ── */
@media(max-width:720px){
  .grid.carrusel{
    display:flex;gap:18px;max-width:none;
    padding:30px 22px 44px;
    overflow-x:auto;overflow-y:hidden;
    overscroll-behavior-x:contain;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .grid.carrusel::-webkit-scrollbar{display:none}
  .carrusel .card{flex:0 0 min(80vw,340px)}
}
@media(max-width:360px){
  .bar .wrap{flex-direction:column;align-items:center;gap:4px}
}

/* ── APARICIÓN AL HACER SCROLL (móvil y tablet) ── */
@media(max-width:1024px){
  .js-reveal .reveal{
    opacity:0;transform:translateY(32px);
    transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1);
    transition-delay:var(--d,0ms);
  }
  .js-reveal .reveal.in{opacity:1;transform:none}
}
</style>

/* Idioma inicial: el guardado, si no el del navegador, si no español */
function idiomaInicial() {

}

/* Oculta "Cargando…" cuando el iframe responde; si tarda, lo quita igualmente */
function vigilarIframes() {

    f.addEventListener("load", done);
    setTimeout(done, 6000);

}

/* ════ CARRUSEL (solo móvil) ════ */
const esMovil = matchMedia("(max-width:720px)");
const sinMovimiento = matchMedia("(prefers-reduced-motion:reduce)");
const VELOCIDAD = 28;                         // px por segundo
let carrusel = null;

function montarCarrusel() {
  const grid = document.getElementById("grid");
  if (carrusel) { cancelAnimationFrame(carrusel.raf); carrusel.quitar(); carrusel = null; }
  grid.classList.remove("carrusel");
  if (!esMovil.matches) return;

  // tres copias (clon | original | clon) para que el bucle no tenga fin en ningún sentido
  const originales = Array.from(grid.children);
  const clonar = function () {
    return originales.map(function (c) {
      const k = c.cloneNode(true);
      k.setAttribute("aria-hidden", "true");
      k.querySelectorAll("a").forEach(a => a.setAttribute("tabindex", "-1"));
      return k;
    });
  };
  grid.prepend(...clonar());
  grid.append(...clonar());
  grid.classList.add("carrusel");

  const n = originales.length;
  const tramo = () => grid.children[2 * n].offsetLeft - grid.children[n].offsetLeft;
  let pos = tramo();
  grid.scrollLeft = pos;

  let tocando = false, espera = null, pausado = false, antes = 0;

  const reanudarLuego = function () {
    clearTimeout(espera);
    pausado = true;
    espera = setTimeout(function () { pausado = false; pos = grid.scrollLeft; }, 1800);
  };
  // salto invisible entre copias cuando se llega a un extremo
  const recolocar = function () {
    const w = tramo();
    if (grid.scrollLeft < w * 0.5)       { pos = grid.scrollLeft + w; grid.scrollLeft = pos; }
    else if (grid.scrollLeft > w * 1.5)  { pos = grid.scrollLeft - w; grid.scrollLeft = pos; }
  };

  const alTocar  = function () { tocando = true; pausado = true; clearTimeout(espera); };
  const alSoltar = function () { tocando = false; reanudarLuego(); };
  const alScroll = function () {
    if (pausado) { if (!tocando) reanudarLuego(); recolocar(); }
  };
  grid.addEventListener("touchstart", alTocar, { passive: true });
  grid.addEventListener("touchend", alSoltar);
  grid.addEventListener("touchcancel", alSoltar);
  grid.addEventListener("pointerdown", alTocar);
  grid.addEventListener("pointerup", alSoltar);
  grid.addEventListener("wheel", reanudarLuego, { passive: true });
  grid.addEventListener("scroll", alScroll, { passive: true });

  carrusel = {
    raf: 0,
    quitar: function () {
      clearTimeout(espera);
      grid.removeEventListener("touchstart", alTocar);
      grid.removeEventListener("touchend", alSoltar);
      grid.removeEventListener("touchcancel", alSoltar);
      grid.removeEventListener("pointerdown", alTocar);
      grid.removeEventListener("pointerup", alSoltar);
      grid.removeEventListener("wheel", reanudarLuego);
      grid.removeEventListener("scroll", alScroll);
    }
  };

  if (sinMovimiento.matches) return;          // se puede deslizar, pero no se mueve solo
  const paso = function (ahora) {
    const dt = antes ? Math.min(ahora - antes, 100) : 0;
    antes = ahora;
    if (!pausado && !document.hidden) {
      pos += VELOCIDAD * dt / 1000;           // acumulado con decimales: scrollLeft redondea
      grid.scrollLeft = pos;
      recolocar();
    }
    carrusel.raf = requestAnimationFrame(paso);
  };
  carrusel.raf = requestAnimationFrame(paso);
}

esMovil.addEventListener("change", function () { aplicarIdioma(LANG); });

/* ════ APARICIÓN AL HACER SCROLL ════ */
const observador = document.documentElement.classList.contains("js-reveal")
  ? new IntersectionObserver(function (entradas) {
      // los que entran a la vez aparecen escalonados
      entradas.filter(e => e.isIntersecting).forEach(function (e, i) {
        e.target.style.setProperty("--d", (i * 90) + "ms");
        e.target.classList.add("in");
        observador.unobserve(e.target);
      });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.12 })
  : null;

function revelar() {
  if (!observador) return;
  // en el carrusel aparece el bloque entero; si no, cada tarjeta
  const proyectos = esMovil.matches ? "#grid" : ".card";
  document.querySelectorAll("h1, .role, .head-meta, .bar, " + proyectos + ", footer h2, .mail, .mail-alt, .fine")
    .forEach(function (el) {
      if (el.classList.contains("in")) return;
      el.classList.add("reveal");
      observador.observe(el);
    });
}

/* ════ SELECTOR DE IDIOMA ════ */
function aplicarIdioma(lang) {
  LANG = TEXTOS[lang] ? lang : "es";
  const T = t();

  document.documentElement.lang = T.htmlLang;
  document.title = T.pageTitle;
  document.querySelector('meta[name="description"]').setAttribute("content", T.metaDesc);

  document.querySelectorAll("[data-i18n]").forEach(function (el) {
    const k = el.getAttribute("data-i18n");
    if (T[k]) el.textContent = T[k];
  });
  document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
    const k = el.getAttribute("data-i18n-html");
    if (T[k]) el.innerHTML = T[k];
  });

  // asunto del correo en el idioma activo
  const cta = document.querySelector(".mail");
  if (cta) {
    cta.href = "https://mail.google.com/mail/?view=cm&fs=1&to=asalmeronpayan@gmail.com&su=" +
               encodeURIComponent(T.mailSubject);
  }

  // estado del botón
  document.getElementById("langFlag").innerHTML = BANDERAS[LANG];
  document.getElementById("langCode").textContent = LANG.toUpperCase();
  document.querySelectorAll("#langMenu button").forEach(function (b) {
    b.setAttribute("aria-current", b.dataset.lang === LANG ? "true" : "false");
  });

  pintarProyectos();
  montarCarrusel();
  fit();
  vigilarIframes();
  revelar();

  try { localStorage.setItem("idioma", LANG); } catch (e) {}
}

(function () {
  const caja = document.getElementById("lang");
  const btn  = document.getElementById("langBtn");

  const abrir = function (v) {
    caja.dataset.open = v ? "true" : "false";
    btn.setAttribute("aria-expanded", v ? "true" : "false");
  };

  btn.addEventListener("click", function (e) {
    e.stopPropagation();
    abrir(caja.dataset.open !== "true");
  });

  document.querySelectorAll("#langMenu button").forEach(function (b) {
    b.addEventListener("click", function () {
      aplicarIdioma(b.dataset.lang);
      abrir(false);
      btn.focus();
    });
  });

  document.addEventListener("click", function () { abrir(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { abrir(false); btn.focus(); }
  });
})();
